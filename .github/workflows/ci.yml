name: JobFinder CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

  repository_dispatch:
    types:
      - vercel.deployment.ready

permissions:
  contents: read
  actions: read
  statuses: write

jobs:
  frontend-ci:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

  backend-ci:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: python -m pytest -v

  docker-build:
    name: Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.ref }}

      - name: Build backend Docker image
        run: docker build -t jobfinder-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t jobfinder-frontend:ci ./frontend

  vercel-deployment-check:
    name: Vercel Deployment Check
    runs-on: ubuntu-latest
    needs:
      - frontend-ci
      - backend-ci
      - docker-build
    if: always()

    steps:
      - name: Report status to Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - job-finder: lint"
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.git.sha || github.ref }}

      - name: Verify all CI jobs passed
        run: |
          echo "Evaluating CI pipeline status:"
          echo "  frontend-ci:  ${{ needs.frontend-ci.result }}"
          echo "  backend-ci:   ${{ needs.backend-ci.result }}"
          echo "  docker-build: ${{ needs.docker-build.result }}"

          if [ "${{ needs.frontend-ci.result }}" != "success" ] || \
             [ "${{ needs.backend-ci.result }}" != "success" ] || \
             [ "${{ needs.docker-build.result }}" != "success" ]; then
            echo "CI pipeline check failed: One or more prerequisite jobs did not succeed."
            exit 1
          fi

          echo "All prerequisite CI jobs (frontend-ci, backend-ci, docker-build) passed successfully."
